name: d894d5b91ae1

networks:
  default:
    name: d894d5b91ae1
  mysql_network:
    external: true
    name: a690a01e6a6f

services:
  c4653888cea6:
    build:
      context: .
      dockerfile: Dockerfile
    image: cun-business-api:latest
    container_name: c4653888cea6
    env_file:
      - path: .env
        required: true
    environment:
      TZ: ${TZ:-America/Bogota}
    ports:
      - "${API_PORT:-40159}:4159"
    # Permite usar DB_HOST=host.docker.internal si MySQL se ejecuta en el host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mysql_network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:4159/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
